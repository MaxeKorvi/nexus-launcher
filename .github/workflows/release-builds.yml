name: Build release packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag
        required: true
        default: "2026.1.0"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build AppImage x86_64
        run: npx electron-builder --linux AppImage --x64 --publish never --config.artifactName='Nexus-Launcher-2026.1.0-x86_64.${ext}'
      - name: Upload AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/Nexus-Launcher-2026.1.0-x86_64.AppImage --clobber

  portable-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows Portable x86
        shell: cmd
        run: npx electron-builder --win portable --ia32 --publish never --config.artifactName="Nexus-Launcher-Portable-2026.1.0-x86.${ext}"
      - name: Upload Portable x86 to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/Nexus-Launcher-Portable-2026.1.0-x86.exe --clobber
