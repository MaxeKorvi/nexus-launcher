name: Build release packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag
        required: true
        default: "2026.1.2"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows Installer (NSIS)
        shell: cmd
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload Installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag || '2026.1.2' }}"
          gh release view "$TAG" || gh release create "$TAG" --title "Nexus Launcher $TAG" --notes "Nexus Launcher Release $TAG"
          gh release upload "$TAG" "dist/Nexus Launcher Setup $TAG.exe" --clobber

  portable-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows Portable x86
        shell: cmd
        run: npx electron-builder --win portable --ia32 --publish never
      - name: Upload Portable x86 to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag || '2026.1.2' }}"
          gh release view "$TAG" || gh release create "$TAG" --title "Nexus Launcher $TAG" --notes "Nexus Launcher Release $TAG"
          gh release upload "$TAG" "dist/Nexus-Launcher-Portable-$TAG-x86.exe" --clobber

  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build AppImage x86_64
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Upload AppImage to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag || '2026.1.2' }}"
          gh release view "$TAG" || gh release create "$TAG" --title "Nexus Launcher $TAG" --notes "Nexus Launcher Release $TAG"
          gh release upload "$TAG" "dist/Nexus-Launcher-$TAG-x86_64.AppImage" --clobber

